<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📝 퀴즈판</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:16px;line-height:1.5}

.wrap{max-width:1100px;margin:0 auto;padding:16px}

.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 12px rgba(40,50,100,.08);padding:18px;margin-bottom:14px}
h1{margin:6px 0;font-size:28px}h2{margin:4px 0 10px;font-size:22px}h3{margin:0 0 10px;font-size:17px}
.muted{color:var(--mute)}.center{text-align:center}.emoji{font-size:54px}
.hero{text-align:center;padding:18px 0 8px}.hero .logo{font-size:56px}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:14px}
input[type=text],input[type=number],input[type=password],select,input:not([type]){width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}

.btn{display:inline-block;border:0;background:#e9ecfb;color:var(--ink);padding:10px 16px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(.96)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn.danger{background:#fee2e8;color:var(--bad)}.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.big{width:100%;padding:15px;font-size:18px;margin-top:14px}.btn.sm{padding:6px 10px;font-size:13px}
.err{color:var(--bad);margin-top:10px;font-weight:700;min-height:1.2em}
.foot{text-align:center;margin-top:18px}.foot a{color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.row>.grow{flex:1 1 160px}

.board{display:flex;flex-direction:column;gap:6px}

.cd-fitbox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cd-txt{display:block;max-width:100%;text-align:center;font-weight:900;line-height:1.15;color:#111;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap;text-wrap:balance}

.tile .th{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:800;color:var(--mute)}

.tile .tf{display:flex;gap:6px;align-items:center}
.tile .tf button{flex:1;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:18px;padding:4px;cursor:pointer}
.tile .tf button.on.o{background:#16a34a;color:#fff;border-color:#16a34a}.tile .tf button.on.x{background:#e11d48;color:#fff;border-color:#e11d48}
.tile .tf button.sug{border-style:dashed;border-color:#16a34a}.tile .tf button.sugx{border-style:dashed;border-color:#e11d48}
.tile .tres{font-weight:800;font-size:14px;text-align:center;width:100%}
.grp{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.grp .gv{font-size:28px;font-weight:900;min-width:120px;text-align:center;word-break:keep-all}.grp .gn{flex:1 1 200px;font-size:13px;color:var(--mute)}
.rate{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}.rate .bar{flex:1;margin:0}
/* 교사 진행 화면: 왼쪽(진행 버튼·순위) 고정, 오른쪽에 답안 벽 */
.live{display:grid;grid-template-columns:minmax(330px,400px) 1fr;gap:14px;align-items:start}
.live-l{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;scrollbar-width:thin}
.live-r{min-width:0}.live2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scrollbox{max-height:34vh;overflow:auto}
@media(max-width:980px){.live,.live2{grid-template-columns:1fr}.live-l{position:static;max-height:none}.scrollbox{max-height:40vh}}
/* 설정 */
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;min-width:900px;width:100%}
.tbl th{font-size:12px;text-align:left;color:var(--mute);padding:4px}.tbl td{padding:3px}
.tbl td input{padding:7px 8px;font-size:14px;border-radius:8px}.tbl td.no{font-weight:800;text-align:center;width:36px}
.tbl.dimq .qcol{opacity:.4}
.note{font-size:13px;color:var(--mute);margin:6px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mcard{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff;margin:0}
.mcard.on{border-color:var(--pri);background:#eef0ff}.mcard input{margin-top:5px}
.mcard b{display:block;font-size:15px}.mcard span{display:block;font-size:13px;color:var(--mute);font-weight:500}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-weight:600}
.overlay{position:fixed;inset:0;background:#fff;z-index:50;padding:30px;overflow:auto;text-align:center}
.overlay .close{position:fixed;top:14px;right:14px;z-index:2}.overlay h2{font-size:34px}
.overlay .board{max-width:760px;margin:0 auto;font-size:22px}
.overlay .bigcode{font-size:110px;font-weight:900;letter-spacing:12px;color:var(--pri)}
.overlay .url{font-size:20px;margin:6px 0 20px;word-break:break-all}#qr{display:inline-block}
.overlay.zoom{display:flex;flex-direction:column;padding:14px;text-align:center}
.zname{font-size:24px;font-weight:900;margin-bottom:6px}.zname small{color:var(--mute);font-size:15px}
.zbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.zbody canvas{border:2px solid var(--line);border-radius:12px}
.zbar{display:flex;gap:12px;justify-content:center;padding:10px;flex-wrap:wrap}
.zbar .btn{font-size:24px;padding:12px 28px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2540;color:#fff;padding:12px 20px;border-radius:99px;z-index:99;font-weight:700;max-width:90%}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============ 설정 ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDgoncuqzhrk7zN6uMfZU3RKZwh0GmBRdA",
  authDomain: "yang1-20f4b.firebaseapp.com",
  databaseURL: "https://yang1-20f4b-default-rtdb.firebaseio.com",
  projectId: "yang1-20f4b",
  storageBucket: "yang1-20f4b.firebasestorage.app",
  messagingSenderId: "545284360762",
  appId: "1:545284360762:web:ac1be05082a9db8b214303"
};
// 교사용 암호: 기존 관리자 암호(admin/password)를 그대로 사용 (기본값 1234)
let adminPassword = localStorage.getItem('adminPwd') || '1234';
/* ================================= */

const CIRC9 = Array.from('①②③④⑤⑥⑦⑧⑨');
const PEN = ['#111827', '#e11d48', '#2563eb', '#16a34a'];
const LDIM = [960, 600], PDIM = [640, 960];   // 그림판 좌표 크기: 가로형 / 세로형 (기기를 세로로 들면 세로형)
const dimsOf = a => (a && +a.dw > 0 && +a.dh > 0) ? [+a.dw, +a.dh] : LDIM;
const pickDims = () => (window.innerHeight > window.innerWidth * 1.1) ? PDIM : LDIM;
const $ = s => document.querySelector(s);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let db = null, TS = null, offset = 0, unsubs = [], tick = null, T = null, S = null, E = null, raf = false, view = 'home', wl = null;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database(); TS = firebase.database.ServerValue.TIMESTAMP;
  db.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0);
  db.ref('admin/password').once('value').then(s => { if (s.exists()) adminPassword = s.val(); }).catch(() => {});
} catch (e) { console.error('Firebase 초기화 실패', e); }
const now = () => Date.now() + offset;

function detach() {
  unsubs.forEach(f => f()); unsubs = []; clearInterval(tick); tick = null; document.body.classList.remove('noscroll');
  if (T && T.qUn) { T.qUn.forEach(f => f()); T.qUn = []; T.curQ = -2; }
  if (S && S.qUnsubs) { S.qUnsubs.forEach(f => f()); S.qUnsubs = []; }
}
function listen(ref, cb) { const h = ref.on('value', s => cb(s.val())); unsubs.push(() => ref.off('value', h)); }
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}
function entriesOf(v) {
  if (v == null) return [];
  if (Array.isArray(v)) return v.map((x, i) => [String(i), x]).filter(([, x]) => x != null);
  return Object.entries(v);
}
const toArr = v => Array.isArray(v) ? v : Object.values(v || {});
const isNum = s => /^-?\d+(\.\d+)?$/.test(s);
const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'ko', { numeric: true });
const qOf = (map, i) => { const e = entriesOf(map).find(([k]) => k == i); return e ? (e[1] || {}) : {}; };
async function keepAwake(on) {
  try {
    if (on) { if (!wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } }
    else if (wl) { await wl.release(); wl = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) keepAwake(true); });

/* ---------- 방식(모드) ---------- */
const MODE_LABEL = { web: '① 웹앱 문제·정답', ppt: '② PPT 문제 · 웹앱 채점', self: '③ PPT 문제·정답 · 각자 채점' };
function normMeta(m) {
  const o = Object.assign({}, m || {});
  if (o.mode === 'question') o.mode = 'web'; else if (o.mode === 'answer') o.mode = 'ppt';
  if (!['web', 'ppt', 'self'].includes(o.mode)) o.mode = 'web';
  if (!['text', 'draw', 'none'].includes(o.input)) o.input = o.mode === 'self' ? 'none' : 'text';
  if (o.mode === 'self') o.grading = 'self';
  else { if (o.input === 'none') o.input = 'text'; o.grading = o.grading === 'teacher' ? 'teacher' : 'auto'; if (o.input === 'draw') o.grading = 'teacher'; }
  o.showRank = o.showRank === undefined ? o.mode !== 'self' : !!o.showRank;
  o.timeLimit = +o.timeLimit || 0; o.points = +o.points || 10; o.total = +o.total || 0;
  o.change = o.change !== false; o.auto = o.auto !== false; o.speed = !!o.speed;
  return o;
}

/* ---------- 채점 ---------- */
function qInfo(q) {
  const n = (q.choices || []).length >= 2 ? q.choices.length : ((+q.nChoices >= 2) ? +q.nChoices : 0);
  return n ? { kind: 'choice', n } : { kind: 'text', n: 0 };
}
function normS(s) {
  s = String(s ?? '').trim().toLowerCase().replace(/[①②③④⑤⑥⑦⑧⑨]/g, c => CIRC9.indexOf(c) + 1);
  return s.replace(/[\s,'"“”‘’!?~]/g, '').replace(/\.+$/, '');
}
function splitAns(a) { return String(a ?? '').split(/[|;｜]/).map(x => x.trim()).filter(Boolean); }
function accepted(q) {
  const info = qInfo(q);
  return splitAns(q.answer).map(a => {
    let n = normS(a);
    if (info.kind === 'choice') { const i = (q.choices || []).findIndex(c => normS(c) === n); if (i >= 0) n = String(i + 1); }
    return n;
  });
}
function grade(q, val) {
  const u = normS(val); if (!u) return false;
  return accepted(q).some(a => a === u || (isNum(a) && isNum(u) && Number(a) === Number(u)));
}
function dispAnswer(q) {
  const info = qInfo(q);
  return splitAns(q.answer).map(a => {
    if (info.kind === 'choice') {
      const k = normS(a), n = parseInt(k);
      if (String(n) === k && n >= 1 && n <= info.n) return CIRC9[n - 1] + (q.choices[n - 1] ? ' ' + q.choices[n - 1] : '');
    }
    return a;
  }).join(' 또는 ');
}
function dispValue(q, v) {
  if (v == null || v === '') return '';
  if (q && q.n >= 2) { const n = parseInt(v); if (n >= 1 && n <= q.n) return CIRC9[n - 1] + (q.choices && q.choices[n - 1] ? ' ' + q.choices[n - 1] : ''); }
  return String(v);
}

/* ---------- 순위·표 ---------- */
function okCount(p) { return entriesOf(p.oks).filter(([, v]) => v == 1).length; }

}

async function joinRoom(code, name, silent) {
  const err = $('#j-err');
  const fail = m => { if (silent) { LS.del('quizsess'); renderHome(); } else if (err) err.textContent = m; };
  if (!/^\d{3,6}$/.test(code)) return fail('방 코드를 숫자로 입력해 주세요.');
  if (!name) return fail('이름을 입력해 주세요.');
  try {
    const meta = (await db.ref(`quizboard/${code}/meta`).once('value')).val();
    if (!meta) return fail('그런 방이 없어요. 코드를 다시 확인해 주세요.');
    const sess = LS.get('quizsess', null);
    let pid = sess && sess.code === code ? sess.pid : null;
    const players = (await db.ref(`quizboard/${code}/players`).once('value')).val() || {};
    if (pid && !players[pid]) pid = null;
    if (!pid) {
      const same = entriesOf(players).find(([, p]) => normS(p.name) === normS(name));
      if (same) { if (silent || confirm('같은 이름으로 이미 참여 중이에요. 이어서 할까요?')) pid = same[0]; else return fail('이름 앞에 번호를 붙여 다시 입장해 주세요. (예: 3번 홍길동)'); }
    }

      pid = db.ref(`quizboard/${code}/players`).push().key;
      await db.ref(`quizboard/${code}/players/${pid}`).set({ name, score: 0, joinedAt: TS });
    }
    LS.set('quizname', name); LS.set('quizsess', { code, pid, name });
    startStudent(code, pid, name);
  } catch (e) { fail('접속에 실패했어요. 잠시 후 다시 시도해 주세요.'); }
}

/* ---------- 교사: 동작 ---------- */
async function guarded(fn) {
  if (!T || T.busy) return; T.busy = true;
  try { await fn(); } catch (e) { console.error(e); toast('처리하지 못했어요. 연결을 확인해 주세요.'); }
  if (T) T.busy = false;
}
const baseRef = () => db.ref(`quizboard/${T.code}`);
async function startQ(i) {
  const t = now(), lim = T.meta.timeLimit || 0, u = {}, players = await freshPlayers();
  u[`answers/${i}`] = null; u[`draft/${i}`] = null; u[`marks/${i}`] = null; u[`reveal/${i}`] = null;
  entriesOf(players).forEach(([id, p]) => { u[`players/${id}/scores/${i}`] = null; u[`players/${id}/oks/${i}`] = null; u[`players/${id}/score`] = totalExcept(p, i); });
  u.state = { q: i, phase: 'open', startedAt: t, endsAt: lim ? t + lim * 1000 : null };
  T.showAns = false; T.peek = false; T.group = false; if (T.overlay === 'zoom') T.overlay = null;
  await baseRef().update(u);
}
async function commitScores(i, okOf) {
  const st = T.state, q = T.qs[i], m = T.meta, lim = m.timeLimit || 0;
  const ans = (await db.ref(`quizboard/${T.code}/answers/${i}`).once('value')).val() || {}, players = await freshPlayers();
  const u = {};
  entriesOf(players).forEach(([id, p]) => {
    const a = ans[id]; let ok = false, pts = 0;
    if (okOf(id, a, q)) { ok = true; pts = q.points; if (m.speed && lim && a && a.t && st.startedAt) pts += Math.round(q.points * 0.5 * Math.max(0, 1 - (a.t - st.startedAt) / (lim * 1000))); }
    u[`players/${id}/scores/${i}`] = pts; u[`players/${id}/oks/${i}`] = ok ? 1 : 0; u[`players/${id}/score`] = totalExcept(p, i) + pts;
  });
  return u;
}
async function doReveal() {
  const st = T.state, i = st.q, q = T.qs[i], lim = T.meta.timeLimit || 0;
  const u = await commitScores(i, (id, a) => a && a.value !== '(그림)' && !(lim && st.endsAt && a.t > st.endsAt + 1500) && grade(q, a.value));
  u[`reveal/${i}`] = { answer: dispAnswer(q), explanation: q.explanation || '' }; u['state/phase'] = 'revealed';
  await baseRef().update(u);
}
async function doStartGrading() { T.group = false; await baseRef().child('state/phase').set('grading'); }

  const st = T.state, i = st.q, q = T.qs[i];
  const marks = (await db.ref(`quizboard/${T.code}/marks/${i}`).once('value')).val() || {}, ans = curAnswers();
  const unmarked = entriesOf(ans).filter(([id]) => T.players[id] && !marks[id]).length;
  if (unmarked > 0 && !confirm(`아직 채점하지 않은 답이 ${unmarked}개 있어요. 오답으로 처리하고 확정할까요?`)) return;
  const u = await commitScores(i, id => marks[id] && marks[id].ok == 1);
  u[`reveal/${i}`] = { answer: q.answer ? dispAnswer(q) : '', explanation: q.explanation || '' }; u['state/phase'] = 'revealed';
  await baseRef().update(u);

  const i = T.state.q, marks = (await db.ref(`quizboard/${T.code}/marks/${i}`).once('value')).val() || {};

    const list = ranked(T.players), dateStr = new Date(m.createdAt || Date.now()).toLocaleDateString('ko-KR');

    const st = T.state; if (!st || !(st.phase === 'grading' || (st.phase === 'revealed' && T.meta.grading === 'self'))) return;
    const pid = el.dataset.pid, ok = +el.dataset.ok, cur = curMarks()[pid], ref = db.ref(`quizboard/${T.code}/marks/${st.q}/${pid}`);
    if (cur && cur.ok === ok && cur.by === 't') ref.remove(); else ref.set({ ok, by: 't' });
  },
  markGroup(el) {
    const st = T.state, ids = T.groups[el.dataset.gi] || [], ok = +el.dataset.ok, u = {};
    ids.forEach(id => { u[`marks/${st.q}/${id}`] = { ok, by: 't' }; }); baseRef().update(u);
  },
  suggestAll() {
    const st = T.state, q = T.qs[st.q], ans = curAnswers(), mk = curMarks(), u = {};
    entriesOf(ans).forEach(([id, a]) => { if (T.players[id] && !mk[id]) u[`marks/${st.q}/${id}`] = { ok: grade(q, a.value) ? 1 : 0, by: 'a' }; });
    if (Object.keys(u).length) baseRef().update(u); else toast('추천할 답이 없어요');
  },
  zoom(el) { T.zoom = el.dataset.pid; T.overlay = 'zoom'; drawOverlay(); },
  zoomNav(el) { const L = zoomList(); if (!L.length) return; let i = L.findIndex(p => p.id === T.zoom); i = (i + (+el.dataset.d) + L.length) % L.length; T.zoom = L[i].id; drawOverlay(); },
  /* 학생 */
  pick(el) { S.pick = el.dataset.v; saveLoc(); document.querySelectorAll('.ch').forEach(b => b.classList.toggle('sel', b === el)); },
  submit() { submitCurrent(false); },
  ready() { submitCurrent(false); },
  edit() {
    const st = S.state; if (!st || st.phase !== 'open') return;
    if (S.myAns && S.meta.input === 'text') { const q = S.qs[st.q]; if (q && q.n >= 2) S.pick = String(S.myAns.value); else S.draft = String(S.myAns.value); }
    S.editing = true; S.pageKey = ''; S.cardKey = ''; renderAll();
  },
  cancelEdit() { S.editing = false; S.pageKey = ''; S.cardKey = ''; renderAll(); },
  cardOpen() { S.cardOpen = true; S.pageKey = ''; S.cardKey = ''; renderAll(); },
  cardClose() { S.cardOpen = false; S.pageKey = ''; S.cardKey = ''; renderAll(); },
  toggleQ(el) { el.classList.toggle('open'); layoutCanvas(); },
  selfMark(el) { selfMark(+el.dataset.ok); },
  tool(el) { const k = el.dataset.k, t = S.tool; if (k === 'er') t.eraser = true; else if (k[0] === 'c') { t.c = +k.slice(1); t.eraser = false; } else if (k[0] === 'w') { t.w = +k.slice(1); t.eraser = false; } renderTools(); },
  undo() { if (!canDraw()) return; S.strokes.pop(); repaint(S.cv, S.strokes, S.k, S.dims); saveLoc(); },
  clearDraw() { if (!canDraw() || !S.strokes.length) return; if (!confirm('그림을 모두 지울까요?')) return; S.strokes = []; repaint(S.cv, S.strokes, S.k, S.dims); saveLoc(); },
  hideTools() { S.hideTools = !S.hideTools; renderTools(); layoutCanvas(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
  const fn = A[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'ans' && S) { S.draft = e.target.value; fitInput(e.target); saveLoc(); markWriting(); } else onField(e);
});
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'xfile') { const f = e.target.files[0]; if (f) readFile(f); } else onField(e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'ans') { if (!e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submitCurrent(false); } }
  else if (e.target.id === 'j-name' || e.target.id === 'j-code') A.join();
});
window.addEventListener('resize', () => {
  if (!S || !S.meta || S.cardKey === 'off' || !S.cardKey) return;
  if (S.meta.input === 'draw') layoutCanvas(); else fitText($('#cd-t'), $('#cd-fitbox'), 640, 20);
});

/* ---------- 시작 ---------- */
(function init() {
  if (!db) return renderHome();
  const sess = LS.get('quizsess', null);
  if (sess) joinRoom(sess.code, sess.name, true); else renderHome();
})();
</script>
</body>
