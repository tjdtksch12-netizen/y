<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📝 퀴즈판</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2540;--mute:#6b7390;--pri:#4f46e5;--pri2:#6d63ff;--ok:#16a34a;--bad:#e11d48;--warn:#f59e0b;--line:#e3e7f3;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:16px;line-height:1.5}
body.noscroll{overflow:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:520px}.wrap.wide{max-width:1400px}.wrap.student{max-width:760px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 12px rgba(40,50,100,.08);padding:18px;margin-bottom:14px}
h1{margin:6px 0;font-size:28px}h2{margin:4px 0 10px;font-size:22px}h3{margin:0 0 10px;font-size:17px}
.muted{color:var(--mute)}.center{text-align:center}.emoji{font-size:54px}
.hero{text-align:center;padding:18px 0 8px}.hero .logo{font-size:56px}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:14px}
input[type=text],input[type=number],input[type=password],select,input:not([type]){width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
.btn{display:inline-block;border:0;background:#e9ecfb;color:var(--ink);padding:10px 16px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(.96)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn.danger{background:#fee2e8;color:var(--bad)}.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.big{width:100%;padding:15px;font-size:18px;margin-top:14px}.btn.sm{padding:6px 10px;font-size:13px}
.err{color:var(--bad);margin-top:10px;font-weight:700;min-height:1.2em}
.foot{text-align:center;margin-top:18px}.foot a{color:var(--mute)}
.tbl.sheetq .qcol:not(.chcol){display:none}
.shthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.shth img{width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:4px}
.wrap.student.sheetmode{max-width:1240px}
.shwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start;margin-top:10px}
.shpages{min-width:0}
.shwrap.solo{display:block;max-width:980px;margin:10px auto 0;padding-bottom:74px}
.shbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--card,#fff);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.12);padding:10px 16px max(10px,env(safe-area-inset-bottom))}
.shbar .btn{flex:1;max-width:420px;height:46px;font-size:17px}.shbar .btn.done{background:var(--ok)}
.shpg{position:relative;background:#eef0f8;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;min-height:220px;overflow:hidden}
.shpg.ld{background:#fff;min-height:0}
.shpg img{width:100%;display:block;cursor:zoom-in}
.shpg.zm{overflow:auto}.shpg .shin{position:relative}.shpg.zm .shin{width:230%}.shpg.zm img{cursor:zoom-out}
.shinl{position:absolute;box-sizing:border-box;background:rgba(255,246,190,.6);border:2px dashed #f59e0b;border-radius:6px;color:#1d4ed8;font-weight:800;text-align:center;padding:0 4px;line-height:1;font-family:inherit;z-index:2;min-width:0}
.shch{cursor:pointer;display:flex;align-items:center;justify-content:center}
.shch:empty::before{content:attr(data-n);color:#c58a1b;font-weight:700;opacity:.75}
.shinl.essay,.shrv.essay{text-align:left;align-items:flex-start;justify-content:flex-start;padding:4px 6px;line-height:1.35;resize:none;white-space:pre-wrap;overflow:auto}
textarea.sh-in{height:auto;min-height:84px;font-size:16px;resize:vertical;flex:1;min-width:160px}
textarea.shinl{height:auto}
.esq{border-top:1px solid var(--line);padding:10px 0}.esa{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}.esa .nm{width:90px;font-weight:800}.esa .tx{flex:1;white-space:pre-wrap;word-break:break-all}
.shinl::placeholder{color:#c58a1b;opacity:.75}
.shinl:focus{outline:none;border-style:solid;background:rgba(255,255,255,.92);box-shadow:0 0 0 3px rgba(79,70,229,.35)}
.shinl:disabled{opacity:.75}
.shrv{position:absolute;box-sizing:border-box;border:2px solid #94a3b8;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;z-index:2;background:rgba(255,255,255,.6);overflow:hidden}
.shrv.ok{border-color:#16a34a;color:#15803d;background:rgba(220,252,231,.75)}.shrv.bad{border-color:#e11d48;color:#be123c;background:rgba(255,228,230,.8)}
.shfix{position:absolute;font-size:12px;font-weight:800;color:#be123c;background:#fff1f2;border:1px solid #fda4af;border-radius:6px;padding:1px 6px;z-index:3;transform:translateY(2px);white-space:nowrap}
.shpop{position:absolute;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:6}
.bxpages{margin-top:8px}
.bxpg{position:relative;margin-bottom:10px;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.bxpg img{width:100%;display:block;pointer-events:none}
.bxpg .pgno{position:absolute;right:8px;top:6px;font-size:11px;background:rgba(0,0,0,.45);color:#fff;border-radius:10px;padding:1px 8px;pointer-events:none}
.bxpg.placing{cursor:crosshair;touch-action:none}
.bxb{position:absolute;box-sizing:border-box;border:2px solid #4f46e5;background:rgba(79,70,229,.16);border-radius:4px;cursor:move;touch-action:none}
.bxb.cur{border-color:#f59e0b;background:rgba(245,158,11,.22)}
.bxb span{position:absolute;left:-2px;top:-19px;background:#4f46e5;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;pointer-events:none}
.bxh{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:#4f46e5;border-radius:3px;cursor:nwse-resize}
.shpg .pgno{position:absolute;right:8px;top:6px;font-size:11px;background:rgba(0,0,0,.45);color:#fff;border-radius:10px;padding:1px 8px;pointer-events:none}
.shans{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;padding:12px}
.shq{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.shq .no{width:28px;text-align:center;font-size:16px}
.shopts{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.shb{min-width:44px;height:44px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:20px;font-weight:800;cursor:pointer;color:var(--ink)}
.shb.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.shb.oxs{min-width:64px;font-size:26px}.shb.oxs.o{color:#2563eb}.shb.oxs.x{color:#e11d48}
.shb.oxs.sel.o{background:#2563eb;color:#fff;border-color:#2563eb}.shb.oxs.sel.x{background:#e11d48;color:#fff;border-color:#e11d48}
.shb:disabled{opacity:.5}
.sh-in{flex:1;min-width:120px;height:44px;font-size:18px}
#sh-submit{margin-top:12px}#sh-submit.done{background:var(--ok)}
@media(max-width:860px){
  .shwrap{grid-template-columns:1fr;padding-bottom:48vh}
  .shwrap.solo{padding-bottom:74px}
  .shans{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:44vh;z-index:25;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .shans.min{max-height:58px;overflow:hidden}
}
#cdn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:45;font-size:min(46vw,340px);font-weight:900;color:rgba(225,29,72,.8);text-shadow:0 6px 30px rgba(0,0,0,.25);opacity:0}
#cdn.on{animation:cdpop 1s ease-out forwards}
@keyframes cdpop{0%{opacity:0;transform:scale(1.5)}15%{opacity:1;transform:scale(1)}80%{opacity:.9}100%{opacity:0;transform:scale(.85)}}
#offline{position:fixed;top:0;left:0;right:0;padding:8px 12px;background:#e11d48;color:#fff;text-align:center;font-weight:800;font-size:14px;z-index:60;transform:translateY(-110%);transition:transform .25s}
#offline.on{transform:none}
.choices.ox{grid-template-columns:1fr 1fr}
.oxb{font-size:4.6rem;font-weight:900;line-height:1;padding:24px 0;justify-content:center}.oxb.o{color:#2563eb}.oxb.x{color:#e11d48}
.gear{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:36px;height:36px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);opacity:.14;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s;z-index:30}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear:hover,.gear:focus-visible{opacity:.7;outline:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.row>.grow{flex:1 1 160px}
.topbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.topbar .code{font-size:34px;font-weight:900;letter-spacing:4px;color:var(--pri)}
.topbar .ttl{flex:1 1 200px;font-size:18px;font-weight:800}.tools{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;background:#eef0ff;color:var(--pri);font-size:12px;padding:2px 9px;border-radius:99px;font-weight:700;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.qhead{font-size:26px;font-weight:900}.qhead small{font-size:15px;color:var(--mute);font-weight:600}
.ansbox{background:#f0fdf4;border:2px dashed #86efac;border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:800}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));width:0;transition:width .3s}
.dist{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}.dist .bar{flex:1;margin:0}
.dist.right b{color:var(--ok)}
.timer{font-size:22px;font-weight:900;margin:6px 0;min-height:1.4em}
.board{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#f7f8fd}
.brow.me{background:#eef0ff;outline:2px solid var(--pri)}.brow.sep{margin-top:8px}
.brow.top1{background:#fff7d6}.brow.top2{background:#eef1f6}.brow.top3{background:#fdeedd}
.brow .rk{width:34px;text-align:center;font-weight:900;font-size:18px}.brow .nm{flex:1;font-weight:700;word-break:break-all}
.brow .ok{color:var(--mute);font-size:13px}.brow .sc{font-weight:900;color:var(--pri);min-width:56px;text-align:right}
.brow .x{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:14px}
.chip{background:#fff;border-radius:99px;padding:6px 14px;font-weight:800;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.chip2{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:99px;padding:4px 12px;margin:3px;font-weight:700}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qtext{font-size:22px;font-weight:800;margin:10px 0 14px;white-space:pre-wrap}
.qimg{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:0 auto 14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.choices{grid-template-columns:1fr}}
.ch{border:3px solid var(--line);background:#fff;border-radius:16px;padding:16px 10px;font:inherit;font-size:19px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;min-height:64px;color:var(--ink)}
.ch.big{min-height:96px;font-size:24px}.ch b{font-size:30px;color:var(--pri)}.ch.sel{border-color:var(--pri);background:#eef0ff}
.bigin{width:100%;min-height:34vh;font-family:inherit;font-weight:900;text-align:center;border:3px solid var(--line);border-radius:18px;padding:18px;resize:none;line-height:1.2;color:var(--ink);background:#fff}
.sub{margin-top:12px;font-weight:700;color:var(--ok);min-height:1.4em}
.res{border-radius:16px;padding:16px;text-align:center;font-size:24px;font-weight:900;margin-bottom:12px}
.res.ok{background:#dcfce7;color:#166534}.res.bad{background:#ffe4ea;color:#9f1239}.res.none{background:#f1f2f8;color:var(--mute)}
.kv{margin:6px 0;font-size:17px}.kv b{color:var(--pri)}
.selfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.selfbtns button{font-size:28px;padding:26px 8px;border-radius:18px;border:4px solid transparent;font-weight:900;cursor:pointer;font-family:inherit;opacity:.85}
.sbtn-ok{background:#16a34a;color:#fff}.sbtn-bad{background:#e11d48;color:#fff}
.selfbtns button.sel,.cd-strip .btn.sel{border-color:#111;opacity:1;box-shadow:0 0 0 4px #fff inset}
.selfbtns button.dim,.cd-strip .btn.dim{opacity:.4}
/* 큰 답 카드 */
.card-ov{position:fixed;inset:0;z-index:40;background:#fff;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.cd-top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:800;color:var(--mute);gap:8px}
.cd-tm{font-weight:900;color:var(--ink);font-size:20px}
.cd-x{border:0;background:#eef0ff;border-radius:99px;padding:6px 14px;font:inherit;font-weight:800;cursor:pointer}
.cd-q{padding:0 14px 6px;font-weight:700;color:#334;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.cd-q.open{-webkit-line-clamp:unset;display:block}
.cd-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 12px;overflow:hidden}
.cd-fit{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-fitbox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cd-txt{display:block;max-width:100%;text-align:center;font-weight:900;line-height:1.15;color:#111;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap;text-wrap:balance}
.cd-sub{font-size:22px;font-weight:700;color:var(--mute);padding-bottom:8px}
.cd-main canvas{background:#fff;border:2px solid var(--line);border-radius:10px;touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.cd-tools{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:6px 10px}
.tbtn{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;font-size:18px;background:#f4f6fb;display:inline-flex;align-items:center;justify-content:center;padding:0}
.tbtn.on{box-shadow:0 0 0 3px var(--pri)}.tbtn .dotw{display:block;border-radius:50%;background:#111}
.cd-strip{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#1f2540;color:#fff;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:800;font-size:18px;min-height:64px}
.cd-strip .btn{font-size:20px;padding:12px 22px;border:4px solid transparent}
.cd-strip .btn.sbtn-ok{background:#16a34a;color:#fff}.cd-strip .btn.sbtn-bad{background:#e11d48;color:#fff}
.cd-strip .hint{font-size:14px;font-weight:600;color:#c7cdee}
/* 교사 답안 벽 */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.wall.big{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{border:3px solid var(--line);border-radius:14px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:110px}
.tile.done{border-color:#a5b4fc;background:#f5f6ff}.tile.draft{border-color:#fde68a;background:#fffbeb}
.tile.ok{border-color:#22c55e;background:#f0fdf4}.tile.bad{border-color:#fb7185;background:#fff1f2}
.tile .th{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:800;color:var(--mute)}
.tile .tb{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;word-break:keep-all;overflow-wrap:anywhere;min-height:50px;line-height:1.2}
.tile .tb[data-act]{cursor:zoom-in}.tile .tb canvas{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.tile .tf{display:flex;gap:6px;align-items:center}
.tile .tf button{flex:1;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:18px;padding:4px;cursor:pointer}
.tile .tf button.on.o{background:#16a34a;color:#fff;border-color:#16a34a}.tile .tf button.on.x{background:#e11d48;color:#fff;border-color:#e11d48}
.tile .tf button.sug{border-style:dashed;border-color:#16a34a}.tile .tf button.sugx{border-style:dashed;border-color:#e11d48}
.tile .tres{font-weight:800;font-size:14px;text-align:center;width:100%}
.grp{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.grp .gv{font-size:28px;font-weight:900;min-width:120px;text-align:center;word-break:keep-all}.grp .gn{flex:1 1 200px;font-size:13px;color:var(--mute)}
.rate{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}.rate .bar{flex:1;margin:0}
/* 교사 진행 화면: 왼쪽(진행 버튼·순위) 고정, 오른쪽에 답안 벽 */
.live{display:grid;grid-template-columns:minmax(330px,400px) 1fr;gap:14px;align-items:start}
.live-l{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;scrollbar-width:thin}
.live-r{min-width:0}.live2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scrollbox{max-height:34vh;overflow:auto}
@media(max-width:980px){.live,.live2{grid-template-columns:1fr}.live-l{position:static;max-height:none}.scrollbox{max-height:40vh}}
/* 설정 */
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;min-width:900px;width:100%}
.tbl th{font-size:12px;text-align:left;color:var(--mute);padding:4px}.tbl td{padding:3px}
.tbl td input{padding:7px 8px;font-size:14px;border-radius:8px}.tbl td.no{font-weight:800;text-align:center;width:36px}
.tbl.dimq .qcol{opacity:.4}
.note{font-size:13px;color:var(--mute);margin:6px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mcard{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff;margin:0}
.mcard.on{border-color:var(--pri);background:#eef0ff}.mcard input{margin-top:5px}
.mcard b{display:block;font-size:15px}.mcard span{display:block;font-size:13px;color:var(--mute);font-weight:500}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-weight:600}
.overlay{position:fixed;inset:0;background:#fff;z-index:50;padding:30px;overflow:auto;text-align:center}
.overlay .close{position:fixed;top:14px;right:14px;z-index:2}.overlay h2{font-size:34px}
.overlay .board{max-width:760px;margin:0 auto;font-size:22px}
.overlay .bigcode{font-size:110px;font-weight:900;letter-spacing:12px;color:var(--pri)}
.overlay .url{font-size:20px;margin:6px 0 20px;word-break:break-all}#qr{display:inline-block}
.overlay.zoom{display:flex;flex-direction:column;padding:14px;text-align:center}
.zname{font-size:24px;font-weight:900;margin-bottom:6px}.zname small{color:var(--mute);font-size:15px}
.zbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.zbody canvas{border:2px solid var(--line);border-radius:12px}
.zbar{display:flex;gap:12px;justify-content:center;padding:10px;flex-wrap:wrap}
.zbar .btn{font-size:24px;padding:12px 28px}

function fitText(el, box, max, min) {

  let lo = min, hi = max, best = min;
  while (lo <= hi) {

/* ======================= 평가지(시험지) ======================= */
/* 평가지 = PDF·그림을 쪽별 그림으로 바꿔 Firebase에 저장해 두고(보관함), 퀴즈방을 열면 학생이 평가지를 보면서 번호별로 답을 입력해요 */
const fmtMS = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const PDFJS_VER = '3.11.174', PAGE_W = 1200;
let pdfReady = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
function ensurePdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  if (!pdfReady) pdfReady = loadScript(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.min.js`).then(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`; }).catch(e => { pdfReady = null; throw e; });
  return pdfReady;
}
function canvasToJpeg(cv) { let q = .82, d = cv.toDataURL('image/jpeg', q); while (d.length > 450000 && q > .5) { q -= .08; d = cv.toDataURL('image/jpeg', q); } return d; }
async function pdfToPages(file, onProg) {
  await ensurePdfJs();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, out = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i), sc = PAGE_W / pg.getViewport({ scale: 1 }).width, vp = pg.getViewport({ scale: sc });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(canvasToJpeg(cv)); if (onProg) onProg(i, pdf.numPages);
  }
  return out;
}
function imgToPage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const sc = Math.min(1, PAGE_W / im.naturalWidth), cv = document.createElement('canvas');
      cv.width = Math.round(im.naturalWidth * sc); cv.height = Math.round(im.naturalHeight * sc);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(canvasToJpeg(cv));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; im.src = url;
  });
}
async function addSheetFiles(files) {
  if (!E || !E.sheet) return;
  const arr = Array.from(files || []); if (!arr.length) return;
  const say = t => { const e = $('#sh-prog'); if (e) e.textContent = t; };
  say('변환하는 중…');
  try {
    for (const f of arr) {
      if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)) E.newPages = (E.newPages || []).concat(await pdfToPages(f, (i, n) => say(`${f.name} 변환 중… ${i}/${n}쪽`)));
      else if (/^image\//.test(f.type)) E.newPages = (E.newPages || []).concat(await imgToPage(f));
      else if (/\.hwpx?$/i.test(f.name)) toast('한글 파일은 바로 읽을 수 없어요. 한글에서 "PDF로 저장"한 파일을 올려 주세요.');
      else toast(`${f.name}: 지원하지 않는 파일이에요`);
    }
    if ((E.newPages || []).length > 30) { E.newPages.length = 30; toast('평가지는 최대 30쪽까지 올릴 수 있어요'); }
  } catch (e) { console.error(e); toast('파일을 변환하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'); }
  if (E && E.sheet) renderSheetEdit();

  entriesOf(players).forEach(([id]) => {
    const a = (sa[id] && sa[id].a) || {}; let tot = 0;
    T.qs.forEach((q, i) => {
      if (q.type === 'essay') { u[`players/${id}/oks/${i}`] = null; u[`players/${id}/scores/${i}`] = null; return; }   // 서술형은 선생님이 채점해요
      const v = a[i], ok = v !== undefined && v !== null && v !== '' && !!q.answer && grade(q, v), pts = ok ? q.points : 0; tot += pts;
      u[`players/${id}/oks/${i}`] = ok ? 1 : 0; u[`players/${id}/scores/${i}`] = pts;
    });
    u[`players/${id}/score`] = tot;
  });
  u.sheetKey = m.showAns === false ? null : T.qs.reduce((o, q, i) => { o[i] = { a: dispAnswer(q), e: q.explanation || '' }; return o; }, {});
  u['state/phase'] = 'finished';
  await baseRef().update(u);
  await saveRecord();
}

/* ---------- 학생: 평가지 보기 · 번호별 답 입력 ---------- */
const SHEET_CACHE = {};
const shKey = () => `qb_sh:${S.code}:${S.pid}`;
const shSaveLoc = () => LS.set(shKey(), S.sh.ans);
function shNormAns(a) { const o = {}; if (a) Object.keys(a).forEach(k => { if (a[k] !== null && a[k] !== undefined && String(a[k]) !== '') o[k] = String(a[k]); }); return o; }
const shSame = (a, b) => { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k => a[k] === b[k]); };
function shEnsure() {
  const m = S.meta;
  if (!S.sh || S.sh.sid !== m.sheetId) { S.sh = { sid: m.sheetId, np: m.np || 0, pages: SHEET_CACHE[m.sheetId] || [], ans: shNormAns(LS.get(shKey(), {})), built: '', loading: false, subKnown: false, sub: null, autoSub: false }; shLoadPages(); }
  const sh = S.sh;
  if (S.sheetSub !== undefined) {
    sh.sub = S.sheetSub && S.sheetSub.a ? shNormAns(S.sheetSub.a) : null;
    if (!sh.subKnown) { sh.subKnown = true; if (sh.sub && !Object.keys(sh.ans).length) { sh.ans = Object.assign({}, sh.sub); shSaveLoc(); } }
  }
}
async function shLoadPages() {
  const sh = S.sh; if (!sh || sh.loading) return; sh.loading = true;
  for (let i = 0; i < sh.np; i++) {
    if (!S || S.sh !== sh) return;
    for (let tries = 0; !sh.pages[i] && tries < 6; tries++) {
      try { sh.pages[i] = (await db.ref(`quizboard/_sheets/${sh.sid}/pages/${i}`).once('value')).val() || ''; } catch (e) { await new Promise(r => setTimeout(r, 1500)); }
      if (!S || S.sh !== sh) return;
    }
    SHEET_CACHE[sh.sid] = sh.pages;
    const im = $('#shp-' + i); if (im && sh.pages[i]) { im.src = sh.pages[i]; im.closest('.shpg').classList.add('ld'); }
    const pg = $('#sh-load'); if (pg) pg.textContent = `평가지를 불러오는 중… ${i + 1}/${sh.np}쪽`;
  }
  sh.loading = false;
  const pg = $('#sh-load'); if (pg) pg.textContent = '평가지를 다 받았어요 ✔';
}
const boxStyle = b => `left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%`;
const optLabel = (q, j) => (q.choices && q.choices[j]) || CIRC9[j] || '';   // 객관식 버튼 글자 (㉮㉯… 또는 ①②…)
const shLbl = i => S.qs[i].label || String(i + 1);
const shText = (q, v) => q.ox ? (v == 1 ? 'O' : v == 2 ? 'X' : String(v)) : q.n >= 2 ? optLabel(q, v - 1) : String(v);
const shShow = (q, v) => q.ox ? (v == 1 ? 'O' : v == 2 ? 'X' : '') : (v >= 1 ? optLabel(q, v - 1) : '');
const shOkOf = i => { const e = entriesOf((S.players[S.pid] || {}).oks).find(([k]) => k == i); return e ? +e[1] : -1; };
function shInlineHTML(pi, mode, dis) {   // 평가지 쪽 위에 겹쳐 놓는 답칸
  let h = '';
  S.qs.forEach((q, i) => {
    const b = q.box; if (!b || b.p !== pi) return;
    if (mode === 'review') {
      const o = shOkOf(i), k = (S.sheetKey || {})[i], sv = (S.sh.sub || S.sh.ans)[i];
      h += `<div class="shrv ${q.essay ? 'essay' : ''} ${o === 1 ? 'ok' : o === 0 ? 'bad' : ''}" style="${boxStyle(b)}">${sv ? esc(shText(q, sv)) : ''}</div>` + (o === 0 && k ? `<div class="shfix" style="left:${b.x}%;top:${b.y + b.h}%">정답 ${esc(k.a || '')}</div>` : '');
    } else if (q.ox || q.n >= 2) h += `<button class="shinl shch" ${dis ? 'disabled' : ''} data-act="shInl" data-i="${i}" data-n="${shLbl(i)}" style="${boxStyle(b)}">${esc(shShow(q, S.sh.ans[i]))}</button>`;
    else if (q.essay) h += `<textarea class="sh-in shinl essay" ${dis ? 'disabled' : ''} data-i="${i}" placeholder="${esc(shLbl(i))}" spellcheck="false" style="${boxStyle(b)}">${esc(S.sh.ans[i] ?? '')}</textarea>`;
    else h += `<input class="sh-in shinl" ${dis ? 'disabled' : ''} data-i="${i}" placeholder="${esc(shLbl(i))}" value="${esc(S.sh.ans[i] ?? '')}" autocomplete="off" autocapitalize="off" spellcheck="false" style="${boxStyle(b)}">`;
  });
  return h;
}
const shPagesInner = (mode, dis) => Array.from({ length: S.sh.np }, (_, i) => `<div class="shpg ${S.sh.pages[i] ? 'ld' : ''}"><div class="shin"><img id="shp-${i}" ${S.sh.pages[i] ? `src="${S.sh.pages[i]}"` : ''} onload="shFitInl()" data-act="shZoom" alt="${i + 1}쪽">${shInlineHTML(i, mode, dis)}</div><span class="pgno">${i + 1} / ${S.sh.np}</span></div>`).join('');
function shFitInl() { document.querySelectorAll('.shinl, .shrv').forEach(el => { const h = el.clientHeight; if (h) el.style.fontSize = (el.classList.contains('essay') ? Math.max(11, Math.min(20, h * 0.26)) : Math.max(11, Math.min(40, h * 0.62))) + 'px'; }); }
window.addEventListener('resize', shFitInl);
function shSet(i, v) {   // 답 바꾸기: 평가지 속 답칸과 오른쪽 목록을 함께 맞춰요
  const sh = S.sh; if (!sh) return;
  if (v === '' || v == null) delete sh.ans[i]; else sh.ans[i] = String(v);
  shSaveLoc();
  const q = S.qs[i], cur = sh.ans[i] ?? '';
  document.querySelectorAll(`#shq-${i} .shb`).forEach(b => b.classList.toggle('sel', cur == b.dataset.v));
  document.querySelectorAll(`.shch[data-i="${i}"]`).forEach(b => { b.textContent = shShow(q, cur); });
  document.querySelectorAll(`.sh-in[data-i="${i}"]`).forEach(inp => { if (inp.value !== cur && document.activeElement !== inp) inp.value = cur; });
  shRefreshBits();
}
function shRowsHTML(dis) {
  return S.qs.map((q, i) => {
    const v = S.sh.ans[i] ?? '', d = dis ? 'disabled' : '';
    const inp = q.ox ? [['1', 'O', 'o'], ['2', 'X', 'x']].map(([k, t, c]) => `<button class="shb oxs ${c} ${v == k ? 'sel' : ''}" ${d} data-act="shPick" data-i="${i}" data-v="${k}">${t}</button>`).join('')
      : q.n >= 2 ? Array.from({ length: q.n }, (_, j) => `<button class="shb ${v == j + 1 ? 'sel' : ''}" ${d} data-act="shPick" data-i="${i}" data-v="${j + 1}">${esc(optLabel(q, j))}</button>`).join('')
      : q.essay ? `<textarea class="sh-in" rows="3" ${d} data-i="${i}" placeholder="답을 써요" spellcheck="false">${esc(v)}</textarea>`
      : `<input class="sh-in" ${d} data-i="${i}" value="${esc(v)}" placeholder="답을 써요" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    return `<div class="shq" id="shq-${i}"><b class="no" ${shLbl(i).length > 3 ? 'style="font-size:12px;width:44px"' : ''}>${esc(shLbl(i))}</b><div class="shopts">${inp}</div></div>`;
  }).join('');
}
function shResultHTML() {
  const sh = S.sh, me = S.players[S.pid] || {}, N = S.qs.length, key = S.sheetKey || {}, sub = sh.sub || sh.ans;
  const oks = entriesOf(me.oks), okOf = i => { const e = oks.find(([k]) => k == i); return e ? +e[1] : -1; };
  const mine = ranked(S.players).find(x => x.id === S.pid), pubRank = S.meta.pubRank;
  return `<div class="card center"><div class="emoji">🏆</div><h2>평가 끝!</h2><div class="kv"><b style="font-size:30px">${me.score || 0}점</b> · 정답 ${mine ? mine.ok : 0}/${N}${pubRank && mine ? ` · ${mine.rank}위` : ''}</div></div>
  <div class="card"><h3>문제별 결과</h3><div class="rscroll"><table class="rtbl"><thead><tr><th>번호</th><th>결과</th><th class="l">내 답</th><th class="l">정답</th></tr></thead><tbody>` +
    S.qs.map((q, i) => { const v = sub[i], k = key[i]; return `<tr><td>${esc(shLbl(i))}</td><td>${q.essay && okOf(i) < 0 ? '<span class="muted" style="font-size:12px">⏳ 채점 중</span>' : markO(okOf(i))}</td><td class="l">${v ? esc(shText(q, v)) : '<span class="muted">-</span>'}</td><td class="l">${k ? esc(k.a || '') : '<span class="muted">-</span>'}${k && k.e ? `<div class="muted" style="font-size:12px">💡 ${esc(k.e)}</div>` : ''}</td></tr>`; }).join('') +
    `</tbody></table></div></div>`;
}
function renderSheetPage(body) {
  const wrap = document.querySelector('.wrap.student'); if (wrap) wrap.classList.add('sheetmode');
  shEnsure();
  const st = S.state, sh = S.sh, ph = !st || st.q < 0 ? 'idle' : st.phase, me = S.players[S.pid] || {};
  const key = [ph, S.qs.length, sh.sid, !!S.sheetKey, entriesOf(me.oks).length, me.score || 0, S.meta.pubRank].join('|');
  if (key === sh.built) { shRefreshBits(); return; }
  sh.built = key;
  if (ph === 'idle') body.innerHTML = `<div class="card center"><div class="emoji">⏳</div><h2>잠시만 기다려요</h2><p class="muted" id="sh-load">${sh.pages.filter(Boolean).length >= sh.np ? '평가지를 다 받았어요 ✔' : '평가지를 불러오는 중…'}</p></div>`;
  else if (ph === 'finished') body.innerHTML = shResultHTML() + `<div class="card"><h3>평가지 다시 보기 <span class="muted" style="font-size:13px">(⭕·❌ 표시)</span></h3><div class="shpages" id="sh-pages">${shPagesInner('review')}</div></div>`;
  else {
    const dis = ph !== 'open', solo = S.qs.length > 0 && S.qs.every(q => q.box);   // 모든 문제에 답칸이 있으면 평가지에만 써요
    body.innerHTML = `<div class="card" style="padding:10px"><div class="row"><div id="s-timer" class="timer grow"></div><span id="sh-status" class="muted"></span></div><div class="bar"><i id="s-bar"></i></div><div class="muted" id="sh-load" style="font-size:12px"></div>${solo ? '<div class="muted" style="font-size:12px">💡 평가지의 노란 칸을 눌러 바로 써요. 쪽을 누르면 확대돼요.</div>' : S.qs.some(q => q.box) ? '<div class="muted" style="font-size:12px">💡 평가지의 노란 칸에 바로 써도 되고, 오른쪽 목록에 써도 돼요. 쪽을 누르면 확대돼요.</div>' : ''}</div>
    <div class="shwrap${solo ? ' solo' : ''}"><div class="shpages" id="sh-pages">${shPagesInner('edit', dis)}</div>
      ${solo ? `<div class="shbar" id="sh-ans"><span class="muted" style="font-weight:800">✏️ <span id="sh-cnt"></span></span><button class="btn primary" id="sh-submit" data-act="shSubmit">제출하기</button></div>` : `<div class="shans card" id="sh-ans"><div class="row"><b style="flex:1">✏️ 답 입력 <span id="sh-cnt" class="muted"></span></b><button class="btn sm primary" id="sh-submit2" data-act="shSubmit">제출</button><button class="btn sm shmin" data-act="shMin">▾ 접기</button></div><div class="shlist">${shRowsHTML(dis)}</div><button class="btn primary big" id="sh-submit" data-act="shSubmit">제출하기</button></div>`}</div>`;
  }
  shRefreshBits(); sheetTick();
}
function shRefreshBits() {
  const sh = S.sh, st = S.state; if (!sh) return;
  const n = Object.keys(sh.ans).length, cnt = $('#sh-cnt'); if (cnt) cnt.textContent = `${n}/${S.qs.length}`;
  const same = !!sh.sub && shSame(sh.sub, shNormAns(sh.ans));
  const stt = $('#sh-status'); if (stt) stt.textContent = same ? '✔ 제출 완료' : sh.sub ? '✏️ 바뀐 답이 있어요' : n ? '아직 제출 전이에요' : '';
  const b = $('#sh-submit'); if (b) { b.textContent = same ? '제출 완료 ✔ (고치면 다시 제출)' : sh.sub ? '고친 답 다시 제출' : '제출하기'; b.classList.toggle('done', same); b.disabled = !st || st.phase !== 'open' || !!sh.over; }
  const b2 = $('#sh-submit2'); if (b2) { b2.textContent = same ? '제출 ✔' : '제출'; b2.disabled = !st || st.phase !== 'open' || !!sh.over; }
}
async function shSubmit(force) {
  const sh = S.sh, st = S.state; if (!sh || !st || (st.phase !== 'open' && !force)) return;
  const a = shNormAns(sh.ans);
  if (sh.sub && shSame(sh.sub, a)) return;
  if (!force && !Object.keys(a).length && !confirm('아직 입력한 답이 없어요. 그래도 제출할까요?')) return;
  try { await db.ref(`quizboard/${S.code}/sheetAns/${S.pid}`).set({ a, t: TS, n: Object.keys(a).length }); if (!force) toast('✅ 제출했어요'); }
  catch (e) { if (!force) toast('제출하지 못했어요. 연결을 확인해 주세요.'); }
}
function sheetTick() {
  const st = S.state, sh = S.sh; if (!st || !sh) return;
  let txt = '', pct = 0;
  if (st.phase === 'open' && st.endsAt) { const left = Math.max(0, st.endsAt - now()), lim = (S.meta.timeLimit || 1) * 1000; sh.over = left <= 0; txt = sh.over ? '⏰ 시간 종료' : `⏱ ${fmtMS(left)}`; pct = left / lim * 100; }
  const t = $('#s-timer'); if (t) t.textContent = txt;
  const bar = $('#s-bar'); if (bar) bar.style.width = pct + '%';
  if ((sh.over || st.phase === 'collect') && !sh.autoSub) {   // 시간이 끝나거나 선생님이 마감하면 지금까지의 답을 자동 제출해요
    sh.autoSub = true; shSubmit(true);
    document.querySelectorAll('#sh-ans .shq button, #sh-ans .shq input, .shinl').forEach(e => e.disabled = true); document.querySelectorAll('.shpop').forEach(p => p.remove()); shRefreshBits();
  }
}

/* ---------- 시작 ---------- */
(function init() {
  const cd = document.createElement('div'); cd.id = 'cdn'; document.body.appendChild(cd);
  if (db) {   // 와이파이가 끊기면 배너로 알려줘요 (잠깐 흔들리는 건 무시)
    const bn = document.createElement('div'); bn.id = 'offline'; bn.textContent = '📶 연결이 끊겼어요. 다시 연결하는 중…'; document.body.appendChild(bn);
    let t = null, was = false;
    db.ref('.info/connected').on('value', s => {
      clearTimeout(t);
      if (s.val() === true) { bn.classList.remove('on'); if (was) { was = false; toast('✅ 다시 연결됐어요'); } }
      else t = setTimeout(() => { was = true; bn.classList.add('on'); }, 2500);
    });
  }
  if (!db) return renderHome();
  const sess = LS.get('quizsess', null);
  if (sess) joinRoom(sess.code, sess.name, true); else renderHome();
})();
